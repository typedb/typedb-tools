name: Loader tests

# `paths` here narrows PR triggers to changes that could affect the Loader binary or its tests.
# Pushes to development/master use the unfiltered branch trigger so we always validate on
# integration regardless of what the patch touched.
on:
  push:
  pull_request:
    paths:
      - 'loader/**'
      - 'common/**'
      - 'tool/connect/**'
      - 'tool/runner/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - 'WORKSPACE'
      - 'BUILD'
      - 'deployment.bzl'
      - '.bazelversion'
      - '.github/workflows/test-loader.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Loader unit tests (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-22.04 }
          - { platform: mac-arm64, runner: macos-26 }
          - { platform: mac-x86_64, runner: macos-26-intel }
    env:
      CARGO_BAZEL_GENERATOR_URL: https://repo.typedb.com/public/public-tools/raw/versions/0.0.0/cargo-bazel-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      # Bazel's git_repository deletes .git right after a fetch, which races git's detached background maintenance.
      - run: git config --global maintenance.auto false && git config --global gc.auto 0
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
          google-credentials: ${{ secrets.BAZEL_CACHE_CREDENTIAL_JSON }}
          bazelrc: |
            build --remote_cache https://storage.googleapis.com/typedb-engineers-bazel-remote-cache-europe-west1
            build --remote_upload_local_results=${{ secrets.BAZEL_CACHE_CREDENTIAL_JSON != '' }}
      - run: bazel test //loader:loader-unit-tests --test_output=streamed
      - run: bazel test //loader/migration:unit-tests //loader/migration:test-migration --test_output=streamed
      - run: bazel test //loader/tests/migration:test-migration-cli --test_output=streamed

  assembly-tests:
    name: Loader assembly tests (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-22.04 }
          - { platform: mac-arm64, runner: macos-26 }
          - { platform: mac-x86_64, runner: macos-26-intel }
    env:
      CARGO_BAZEL_GENERATOR_URL: https://repo.typedb.com/public/public-tools/raw/versions/0.0.0/cargo-bazel-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      # Bazel's git_repository deletes .git right after a fetch, which races git's detached background maintenance.
      - run: git config --global maintenance.auto false && git config --global gc.auto 0
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
          google-credentials: ${{ secrets.BAZEL_CACHE_CREDENTIAL_JSON }}
          bazelrc: |
            build --remote_cache https://storage.googleapis.com/typedb-engineers-bazel-remote-cache-europe-west1
            build --remote_upload_local_results=${{ secrets.BAZEL_CACHE_CREDENTIAL_JSON != '' }}
      - run: bazel test //loader/tests/assembly:test-loader --test_output=streamed
